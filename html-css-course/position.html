<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Practice</title>
</head>
<body style="height: 3000px;">
    <div style="
    background-color: black;
    color: white;
    position: fixed;
    top: 0;
    left: 0;
    right: 50px;
    height: 50px;
    "> header </div>

    <div style="
    position: absolute;
    background-color: red;
    left: 10px;
    top: 10px;
    ">
        absolute
    </div>

    <div style="
    background-color: lightblue;
    width: 200px;
    height: 200px;
    position: static;
    ">div 1</div>

    <div style="
    background-color: lightpink;
    width: 200px;
    height: 200px;
    ">div 2</div>
</body>
</html>
