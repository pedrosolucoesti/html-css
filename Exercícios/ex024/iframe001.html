<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            box-shadow: 5px 5px 10px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do
        
        <!--Tamanho padrão Width: 300px Height: 150px-->
        <iframe src="https://www.cursoemvideo.com" scrolling="no" frameborder="0" width="400px" height="400px"></iframe>
        
        para aprender a programar</p>
        <p>O site do 
            
            <iframe src="https://www.google.com.br" frameborder="0"></iframe>

            é muito legal!</p>
            <p>O repositório do Guanabara
                
                <iframe src="https://gustavoguanabara.github.io" frameborder="0"></iframe>
                
                também é bem legal</p>
</body>
</html>
