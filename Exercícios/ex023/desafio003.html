<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabela - 003</title>
    <style>
        table {
            border-collapse: collapse;
            width: 600px;
        }

        th, td {
            border: 2px solid black;
            padding: 5px 10px;
        }

        th {
            background-color: gray;
        }
    </style>
</head>
<body>
    <table>
        <caption>Desafio Tabela - 002</caption>
        <thead>
            <tr>
                <th rowspan="2" colspan="2" scope="row">Área</th>
                <th rowspan="2" colspan="2" scope="row">Disciplinas</th>
                <th colspan="2" scope="rowgroup">Notas</th>
                <th rowspan="2" scope="row">Média</th>
            </tr>
            <tr>
                <th scope="row">Nota 1</th>
                <th scope="row">Nota 2</th>
            </tr>
        </thead>
        <tr>
            <th rowspan="4" colspan="2" scope="colgroup" >Exatas</th>
            <td colspan="2">Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td colspan="2">Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td colspan="2">Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td colspan="2">Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th colspan="6" scope="rowgroup">Média Exatas</th>
            <td>0.0</td>
        </tr>
        <tr>
            <th rowspan="2" colspan="2" scope="colgroup">Humanas</th>
            <td colspan="2">História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td colspan="2">Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th colspan="6">Média de Humanas</th>
            <td>0.0</td>
        </tr>
    </table>
</body>
</html>
