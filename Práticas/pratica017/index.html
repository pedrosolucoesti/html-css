<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sazuke.com</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>PROGRAMADORES DOENTES E PISICOPATAS</h1>
        <nav class="navigation">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Contato</a></li>
                <li><a href="#">Compras</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <h1>LOGIN dos PROGRAMADORES</h1>
        <form>
            <div class="box-input">
                <label for="input_nome">Nome:</label>
                <input id="input_nome" type="text" placeholder="Digite seu nome: " name="input_nome">
            </div>

            <div class="box-input">
                <label for="input_nome">Sobrenome:</label>
                <input id="input_sobrenome" type="text" placeholder="Digite seu sobrenome: " name="input_sobrenome">
            </div>


            <div class="box-input">
                <label for="input_email">Email:</label>
                <input id="input_email" type="email" placeholder="Digite seu email: " name="input_email">
            </div>


            <div class="box-input">
                <label for="input_idade">Idade:</label>
                <input id="input_idade" type="number" placeholder="Digite sua idade: " name="input_idade">
            </div>

    
            <div class="box-input">
                <label for="input_pais">Pais:</label>
                <input id="input_pais" type="text" placeholder="Qual seu Pais: " name="input_pais">
            </div>

            <div class="box-input">
                <label for="input_estado">Estado:</label>
                <input id="input_estado" type="text" placeholder="Qual seu estado: " name="input_estado">
            </div>
        </form>
    </main>
</body>
</html>
