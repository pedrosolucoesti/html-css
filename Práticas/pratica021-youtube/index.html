<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube.com Clone</title>
</head>
<body>
    <header class="header">

        <div id="start" class="logo-box">
            <img class="icon-header menu" src="imagens/icons8-cardápio-50.png" alt="menu" width="20px">

            <div class="logo">
                <img class="logo-img" src="imagens/icons8-youtube-64.png" alt="youtube-logo">
                <p class="font-bold">YOUTUBE</p>
                <p id="br" class="font-light"><sup>BR</sup></p>
            </div>
        </div>

        <div id="center" class="search-box">
            <div class="input-content">
                <input class="font-light" type="text" placeholder="Pesquisar">
                <img class="icon-header teclado" src="imagens/icons8-teclado-80.png" alt="teclado">
            </div>
            <div class="search-button">
                <img class="icon-header" src="imagens/icons8-pesquisar-30.png" alt="search-icon">
            </div>
            <div class="speak-search">
                <img class="icon-header" src="imagens/icons8-microfone-24.png" alt="speak-search">
            </div>
        </div>

        
        <header class="header-teste">
            <div class="testemedia">
                <div class="logo-teste">
                    <img class="logo-img" src="imagens/icons8-youtube-64.png" alt="youtube-logo">
                    <p class="font-bold">YOUTUBE</p>
                </div>
                <div class="right-teste">
                    <img id="live" src="imagens/icons8-youtube-ao-vivo-24 (1).png" alt="">
                    <div class="sino">

                        <img class="icon-header" src="imagens/icons8-sino-24.png" alt="notification">
                        <p>2</p>
                        
                    </div>
                    <img id="search" src="imagens/icons8-pesquisar-30.png" alt="search">
                </div>
            </div>
        </header>
        

        <div id="end" class="user-area">

            <div class="create-content">
                <img class="icon-header" src="imagens/icons8-soma-25.png" alt="create-icon">
                <p class="font-light">Criar</p>
            </div>

            <div class="notification">
                <img class="icon-header" src="imagens/icons8-sino-24.png" alt="notification">

                <div class="qntnotification">
                    <p>2</p>
                </div>
            </div>

            <div class="account-client icon-header">
                <img class="channel-profile" src="imagens/channels4_profile.jpg" alt="account-logo">
            </div>

        </div>
    </header>
</body>
</html>
