<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,  initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/styles.css" />
    <title>Cópia Rocktseat</title>
  </head>
  <body>
    <header class="header">
        <div class="header-left flex-center-center">
            <button class="menu-container-header flex-center-center cursor-pointer">
                <img src="/imagens/icon-menu.png" alt="menu-header" class="menu-header">
            </button>
            <div class="logo-header flex-center-center">
                <img src="/imagens/rocketseat-logo.svg" alt="logo-rocketseat">
            </div>
        </div>
        <div class="header-center flex-center-center">
            <form class="input-box flex-center-center">
                <button class="icon-search-container cursor-pointer">
                    <img src="/imagens/icon-search.png" alt="search-icon" class="icon-search">
                </button>
                <div class="input-container">
                    <input type="text" placeholder="Busque por assuntos e aulas " class="input-header">
                </div>
                <div class="barra-input-lateral">
                    <span>/</span>
                </div>
            </form>
        </div>
        <nav class="header-right flex-center-center">

            <div class="life-header-container flex-center-center">
                <button class="life-header cursor-pointer">
                    <img src="/imagens/icon-fogo.png" alt="vidas-header" class="life-header-icon">
                </button>

                <span class="life-header-quant">
                    <p>0</p>
                </span>
            </div>

            <button class="button-login-container cursor-pointer">
                <a href="#" class="button-login">Entrar</a>
            </button>

            <button class="start-free-header cursor-pointer">
                <a href="#">Comece grátis</a>
            </button>
        </nav>
    </header>
    <script src="/scripts/script.js"></script>
  </body>
</html>
