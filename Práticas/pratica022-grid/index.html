<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Pratica Grid</title>
</head>
<body>
    <div class="container">
        <input class="input" type="text" placeholder="Calculadora: " id="input">
        <div class="button" onclick="soma()" id="limpar">AC</div>
        <div class="button" onclick="soma()" id="troca-soma">+/-</div>
        <div class="button" onclick="soma()" id="barra">/</div>
        <div class="button" onclick="soma()" id="multiplicacao">*</div>
        <div class="button" onclick="soma()" id="sete">7</div>
        <div class="button" onclick="soma()" id="oito">8</div>
        <div class="button" onclick="soma()" id="nove">9</div>
        <div class="button" onclick="soma()" id="menos">-</div>
        <div class="button" onclick="soma()" id="quatro">4</div>
        <div class="button" onclick="soma()" id="cinco">5</div>
        <div class="button" onclick="soma()" id="seis">6</div>
        <div class="button" onclick="soma()" id="mais">+</div>
        <div class="button" onclick="soma()" id="um">1</div>
        <div class="button" onclick="soma()" id="dois">2</div>
        <div class="button" onclick="soma()" id="tres">3</div>
        <div class="button" onclick="soma()" id="igual">=</div>
        <div class="button" onclick="soma()" id="zero">0</div>
        <div class="button" onclick="soma()" id="ponto">.</div>
    </div>
</body>
</html>
