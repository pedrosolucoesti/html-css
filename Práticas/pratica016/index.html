<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratica 16/08</title>
</head>
<body>
    <header class="header">
        <img src="imagens/spotify-logo-gimp.png" alt="logo-spotify">
        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">Premium</a>
            <a href="#">Contato</a>
        </nav>
    </header>


    <ul class="login-container">
        <img src="imagens/spotify-icon-white.png" alt="spotify-white">
        <h1 class="text-main">Entrar no Spotify</h1>

        <li>
            <button class="btn">
                <img src="imagens/google-icon.png" alt="">
                <label class="text">Continuar com o Google</label>
            </button>
        </li>

        <li>
            <button class="btn">
                <img src="imagens/facebook-icon.png" alt="">
                <label class="text">Continuar com o Facebook</label>
            </button>
        </li>

        <li>
            <button class="btn">
                <img src="imagens/apple-icon-white.png" alt="apple-icon">
                <label class="text">Continuar com a Apple</label>
            </button>
        </li>

        <li>
            <button class="btn">
                <label class="text">Continuar com um número de <br> telefone</label>
            </button>
        </li>

        <div class="linha"></div>

        <label class="input">Email ou nome de usuário
            <input type="email" placeholder="Digite Seu Email: ">
        </label>

    </ul>
    
    <footer><h5>Direitos Reservados por PedroDev</h5></footer>
    
</body>
</html>
