<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="/rocketseat/styles/header.css">
    <link rel="stylesheet" href="/rocketseat/styles/aside.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header class="header">
        <div class="left-header flex-class">
            <button class="container-menu">
                <img src="imagens/icons/menu-left.svg" alt="menu-header" class="icon-menu">
            </button>
            <div class="container-logo-rocketseat">
                <img src="imagens/rocketseat-logo.svg" alt="logo-rocketseat" class="logo-rocketseat">
            </div>
        </div>
        <form action="" class="center-header border-white-primary container-input">
            <button class="container-search-icon">
                <img src="imagens/icons/icons8-pesquisar.svg" alt="botão-pesquisar" class="search-icon">
            </button>
            <input type="text" name="input-header" class="input-header" placeholder="Busque por assuntos e aulas " alt="input-header">
            <span class="barra-right-input">
                <p>/</p>
            </span>
        </form>
        <nav class="navigation right-header flex-class">
            <div class="container-life-header flex-class">
                <span class="life-header-icon-container">
                    <img src="imagens/icons/icons8-fogo-30.png" alt="icone-fogo-life" class="life-header-icon">
                </span>
                <span class="life-header-quantit">
                    <p>2</p>
                </span>
            </div>
            <div class="button-login-header">
                <button class="login-header">
                    Entrar
                </button>
            </div>
            <div class="button-cadastro-header">
                <button class="assinatura-header">
                    Comece grátis
                </button>
            </div>
        </nav>
    </header>
    <aside class="aside">
        <nav class="navigation-aside">
            
        </nav>
    </aside>
</body>
</html>
