<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imagens/logo-airbnb-header.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb | Locações por temporada, chalés, casas de praia e muito mais</title>
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="imagens/logo-airbnb-header.png" alt="logo-airbnb">
            <span>airbnb</span>
        </div>
        <nav class="navigation">
            <div class="item-nav" id="acomodacoes" onclick="main()">
                <img src="imagens/img-casa-header.png" alt="acomodações">
                <p id="text-acomodacoes">Acomodações</p>
            </div>
            <div class="item-nav" id="experiencias" onclick="main()">
                <img src="imagens/img-balao-header.png" alt="experiências" >
                <p>Experiências</p>
            </div>
            <div class="item-nav" id="servicos" onclick="main()">
                <img src="imagens/img-sineta-header.png" alt="serviços">
                Serviços
            </div>
        </nav>
        <div class="right-header">
            <p>Torne-se um anfitrião</p>
            <div class="right-items">
                <img src="imagens/img-globo-header.png" alt="linguagem">
            </div>
            <div class="right-items">
                <img src="imagens/img-menu-header.png" alt="menu">
            </div>
        </div>
    </header>
</body>
</html>
