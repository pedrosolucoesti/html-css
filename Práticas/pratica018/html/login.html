<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="../style/style-login.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
</head>
<body>
    <main class="container">
        <h1 class="font-main">LOGIN</h1>
        <div class="input-box">
            <input type="email" placeholder="Digite seu email: " required>
            <input type="password" placeholder="Digite sua senha: " required>
        </div>
        <div class="remember">
            <p><input type="checkbox" > Lembre de mim</p>
            <a href="password-forgot.html">Esqueci minha senha</a>
        </div>
        <button type="submit" class="border-button">ENTRAR</button>
        <div class="have-account">
            <p>Não tem uma conta?</p>
            <a href="create-account.html">Cadastre-se</a>
        </div>
    </main>
</body>
</html>
